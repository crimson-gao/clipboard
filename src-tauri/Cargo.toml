[package]
name = "app"
version = "0.1.0"
description = "A macOS clipboard manager built with Tauri 2."
authors = ["Clipboard contributors"]
license = "MIT"
repository = "https://github.com/example/clipboard"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
cargo-clippy = []

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
clipboard-rs = "0.3.4"
chrono = { version = "0.4", features = ["serde", "clock"] }
clipboard-watcher = "0.1"
futures-util = "0.3"
html2text = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-mcp-bridge = "0.11"
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSResponder", "NSWorkspace", "NSRunningApplication", "libc"] }
objc2-foundation = "0.3.2"
